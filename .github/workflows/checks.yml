name: Check repository

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check documentation
        run: python3 scripts/check-docs.py
      - name: Check GitHub Actions workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: git diff --check "$BASE_SHA" HEAD
      - name: Check script syntax
        run: |
          bash -n scripts/package-release.sh
          bash -n scripts/verify-release.sh
          sh -n scripts/copy-smart-mask-models.sh
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z', '*.py']).decode().split('\0')
          for name in filter(None, paths):
              compile(Path(name).read_bytes(), name, 'exec')
          PY
